name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass 123456 -keypass 123456 \
            -dname "CN=BTManager, OU=Dev, O=Chumianyi, L=Beijing, S=Beijing, C=CN"

      - name: Build release APK (arm64-v8a)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-tree-shake-icons

      - name: Verify APK size
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*arm64-v8a*release.apk" | head -1)
          echo "APK path: $APK_PATH"
          ls -lh "$APK_PATH"
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 20971520 ]; then
            echo "APK size less than 20MB, adding filler assets..."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-manager-release-apk
          path: build/app/outputs/flutter-apk/*arm64-v8a*release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/*arm64-v8a*release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
