name: bt_manager
description: 服务器宝塔管理器 - SSH终端、服务器监控、宝塔面板、文件管理、防火墙管理
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  dartssh2: ^2.8.2
  xterm: ^3.5.0
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  convert: ^3.1.1
  intl: ^0.18.1
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  permission_handler: ^11.1.0
  flutter_local_notifications: ^16.3.0
  package_info_plus: ^5.0.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
